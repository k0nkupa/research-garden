  <text x="72" y="83" class="eyebrow">RESEARCH GARDEN / TREE VISUAL DIRECTION B</text><text x="72" y="123" class="title">Vascular instrument</text><text x="72" y="151" class="subtitle">Precise double strokes make structure legible; a pollen sap trace marks the selected evidence path.</text><text x="1368" y="83" text-anchor="end" class="meta">APPROVAL PROTOTYPE · SVG ONLY</text>
  <g transform="translate(72 190)"><rect width="1296" height="548" rx="12" class="panel"/><text x="28" y="39" class="eyebrow">01 / EMPTY</text><text x="28" y="67" class="panel-label">Instrument at rest</text><text x="28" y="89" class="panel-note">Plain trunk; no relationship data.</text><text x="438" y="39" class="eyebrow">02 / YOUNG</text><text x="438" y="67" class="panel-label">Signal begins</text><text x="438" y="89" class="panel-note">Each solid limb is a Parent edge.</text><text x="878" y="39" class="eyebrow">03 / MATURE</text><text x="878" y="67" class="panel-label">Evidence in circuit</text><text x="878" y="89" class="panel-note">The pollen trace follows selected Roots.</text>
