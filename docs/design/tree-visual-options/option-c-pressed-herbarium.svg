  <g transform="translate(72 770)"><text class="eyebrow" x="0" y="0">COMPONENT STRIP / THE DYNAMIC SEAM</text><g transform="translate(0 26)"><rect width="1296" height="175" rx="12" fill="#F5F8F4" stroke="#C8D4C9"/><g transform="translate(82 116)"><use href="#trunk-c" transform="scale(.45)"/><text x="-30" y="62" class="small-label">permanent</text><text x="-30" y="77" class="small-label">paper trunk + roots</text></g><g transform="translate(265 105)"><path class="limb" d="M-46 30C-15 3 10-10 48-26"/><path class="limb-inset" d="M-45 27C-13 2 11-12 45-23"/><use href="#junction" class="glyph" transform="translate(60 -31) scale(.75)" fill="#21332B" stroke="#21332B"/><text x="-52" y="68" class="small-label">parent specimen limb</text></g><g transform="translate(464 105)"><path class="root" d="M-48-15C-10 3 11 20 47 35"/><path class="root-detail" d="M-48-15C-10 3 11 20 47 35"/><use href="#evidence-node" class="glyph" transform="translate(60 41) scale(.72)" fill="#F5F8F4" stroke="#21332B"/><text x="-54" y="68" class="small-label">evidence Root</text></g><g transform="translate(665 94)"><line class="soil" x1="-74" y1="0" x2="74" y2="0"/><path class="root" d="M-42 4C-28 22-13 33 0 40M10 4C26 21 39 29 53 38" transform="scale(.65)"/><text x="-34" y="68" class="small-label">pressed soil line</text></g><g transform="translate(820 45)"><text class="meta" x="0" y="0">EIGHT MOUNTED SPECIMENS / SHAPE + MARK + LABEL + TONE</text><g transform="translate(20 39)"><use href="#pod" class="glyph" fill="#9CB29B" stroke="#21332B"/><text x="-18" y="30" class="small-label">Seed</text></g><g transform="translate(80 39)"><use href="#evidence-node" class="glyph" fill="#F5F8F4" stroke="#21332B"/><text x="-18" y="30" class="small-label">Root</text></g><g transform="translate(140 39)"><use href="#junction" class="glyph" fill="#21332B" stroke="#21332B"/><text x="-25" y="30" class="small-label">Branch</text></g><g transform="translate(200 39)"><use href="#filled-leaf" class="glyph" fill="#3C6B53" strok