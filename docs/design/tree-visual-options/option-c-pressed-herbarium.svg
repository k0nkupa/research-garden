  <rect width="1440" height="1024" fill="#EDF3EE"/><rect x="34" y="30" width="1372" height="964" rx="18" fill="url(#paper-c)" stroke="#D2DDD3"/>
  <text x="72" y="83" class="eyebrow">RESEARCH GARDEN / TREE VISUAL DIRECTION C</text><text x="72" y="123" class="title">Pressed herbarium</text><text x="72" y="151" class="subtitle">Crisp paper silhouettes keep every specimen, relationship, and label calm enough to read.</text><text x="1368" y="83" text-anchor="end" class="meta">APPROVAL PROTOTYPE · SVG ONLY</text>
