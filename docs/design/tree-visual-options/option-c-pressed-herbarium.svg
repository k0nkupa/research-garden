<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Research Garden Tree — pressed herbarium direction</title>
  <desc id="desc">Approval prototype using crisp layered paper silhouettes. The empty tree is only a trunk, root flare, and soil; young and mature states add separate dynamic limbs, specimen-like nodes, and evidence roots.</desc>
  <defs>
    <style><![CDATA[
      .title{font:600 30px 'Literata','Iowan Old Style',Georgia,serif;fill:#21332B}.subtitle{font:15px 'Instrument Sans','Helvetica Neue',Arial,sans-serif;fill:#53645A}.eyebrow{font:600 11px 'IBM Plex Mono',ui-monospace,Menlo,monospace;letter-spacing:.16em;fill:#7A4E64}.panel-label{font:600 18px 'Literata','Iowan Old Style',Georgia,serif;fill:#21332B}.panel-note,.small-label{font:12px 'Instrument Sans','Helvetica Neue',Arial,sans-serif;fill:#53645A}.meta{font:11px 'IBM Plex Mono',ui-monospace,Menlo,monospace;fill:#53645A;letter-spacing:.04em}.node-label{font:13px 'Literata','Iowan Old Style',Georgia,serif;fill:#21332B;paint-order:stroke;stroke:#EDF3EE;stroke-width:5px;stroke-linejoin:round}.panel{fill:#F5F8F4;stroke:#C8D4C9;stroke-width:1}.soil{stroke:#21332B;stroke-opacity:.35;stroke-width:1.5;stroke-dasharray:3 7;stroke-linecap:round}.trunk-shadow{fill:#9CB29B;stroke:#21332B;stroke-width:2;stroke-linejoin:round}.trunk{fill:#21332B;stroke:#21332B;stroke-width:2;stroke-linejoin:round}.trunk-inset{fill:#9CB29B;opacity:.74}.root{fill:none;stroke:#21332B;stroke-width:5;stroke-linecap:round}.root-detail{fill:none;stroke:#9CB29B;stroke-width:1.5;stroke-linecap:round}.limb{fill:none;stroke:#21332B;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.limb-inset{fill:none;stroke:#9CB29B;stroke-width:2;stroke-linecap:round}.cross{fill:none;stroke:#9CB29B;stroke-width:2;stroke-dasharray:6 6;stroke-linecap:round}.contradicts{fill:none;stroke:#7A4E64;stroke-width:2.5;stroke-dasharray:7 5;stroke-linecap:round}.glyph{stroke-width:2.4;stroke-linejoin:round}.glyph-mark{fill:none;stroke:#21332B;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.glyph-mark-on-fill{stroke:#EDF3EE}.legend-line{stroke:#21332B;stroke-width:3;stroke-linecap:round}.legend-dash{stroke:#7A4E64;stroke-width:2;stroke-dasharray:6 5;stroke-linecap:round}
    ]]></style>
