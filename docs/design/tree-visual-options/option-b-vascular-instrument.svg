<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Research Garden Tree — vascular instrument direction</title>
  <desc id="desc">Approval prototype with a precise double-stroke tree. Bark is the outer structure and a fine sap line identifies selected evidence through the growing knowledge tree.</desc>
  <defs>
    <style><![CDATA[
      .title{font:600 30px 'Literata','Iowan Old Style',Georgia,serif;fill:#21332B}.subtitle{font:15px 'Instrument Sans','Helvetica Neue',Arial,sans-serif;fill:#53645A}.eyebrow{font:600 11px 'IBM Plex Mono',ui-monospace,Menlo,monospace;letter-spacing:.16em;fill:#7A4E64}.panel-label{font:600 18px 'Literata','Iowan Old Style',Georgia,serif;fill:#21332B}.panel-note,.small-label{font:12px 'Instrument Sans','Helvetica Neue',Arial,sans-serif;fill:#53645A}.meta{font:11px 'IBM Plex Mono',ui-monospace,Menlo,monospace;fill:#53645A;letter-spacing:.04em}.node-label{font:13px 'Literata','Iowan Old Style',Georgia,serif;fill:#21332B;paint-order:stroke;stroke:#EDF3EE;stroke-width:5px;stroke-linejoin:round}.panel{fill:#F5F8F4;stroke:#C8D4C9;stroke-width:1}.soil{stroke:#21332B;stroke-opacity:.36;stroke-width:1.5;stroke-dasharray:3 7;stroke-linecap:round}.trunk{fill:none;stroke:#21332B;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}.sap{fill:none;stroke:#9CB29B;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.root{fill:none;stroke:#21332B;stroke-width:4;stroke-linecap:round}.limb{fill:none;stroke:#21332B;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.cross{fill:none;stroke:#9CB29B;stroke-width:2;stroke-dasharray:6 6;stroke-linecap:round}.contradicts{fill:none;stroke:#7A4E64;stroke-width:2.5;stroke-dasharray:7 5;stroke-linecap:round}.evidence-sap{fill:none;stroke:#D6A63A;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.glyph{stroke-width:2.4;stroke-linejoin:round}.glyph-mark{fill:none;stroke:#21332B;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.glyph-mark-on-fill{stroke:#EDF3EE}.legend-line{stroke:#21332B;stroke-width:3;stroke-linecap:round}.legend-sap{stroke:#D6A63A;stroke-width:3;stroke-linecap:round}
    ]]></style>
    <pattern id="instrument-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5H24M23.5 0V24" stroke="#9CB29B" stroke-opacity=".08" stroke-width="1"/></pattern>
